<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Unwrap</title>
  <meta name="description" content="Open your invitation to reveal what is inside.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="🎁 Unwrap Your Invitation">
  <meta property="og:description" content="Your surprise is ready. Tap to open your invitation!">
  <meta property="og:url" content="https://paco-jasso.github.io/unwrap-web/">
  <meta property="og:image" content="https://paco-jasso.github.io/unwrap-web/unwrap-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A wrapped gift and the words Unwrap and Your invitation is ready">
  <link rel="stylesheet" href="./unwrap.css">
  <script src="./unwrap.js" defer></script>
</head>
<body>
  <main class="invitation">
    <span class="gift" aria-hidden="true">🎁</span>
    <h1>Unwrap</h1>
    <p id="instruction">Your surprise is wrapped and ready.</p>
    <button id="reveal" type="button" hidden>Unwrap my invitation</button>
    <div id="result" role="status" aria-atomic="true"></div>
    <noscript>Enable JavaScript in your browser to open your invitation.</noscript>
  </main>
</body>
</html>
