<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Unwrapp · Valentine’s</title>
  <meta name="description" content="Open your Valentine’s invitation to find out who you’re shopping for.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="❤️ Unwrap Your Valentine’s Invitation">
  <meta property="og:description" content="Your Valentine’s assignment is ready. Tap to open your invitation!">
  <meta property="og:url" content="https://paco-jasso.github.io/unwrap-web/valentines.html">
  <meta property="og:image" content="https://paco-jasso.github.io/unwrap-web/unwrap-valentines-preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A pink heart and the words Unwrapp and Valentine’s">
  <link rel="stylesheet" href="./unwrap.css">
  <script src="./unwrap.js" defer></script>
</head>
<body class="valentines">
  <main class="invitation">
    <span class="gift" aria-hidden="true">❤️</span>
    <h1>Unwrapp</h1>
    <p class="welcome">Welcome<strong id="guest-name"></strong></p>
    <p id="instruction">Your secret Valentine is wrapped and ready.</p>
    <p id="budget" hidden></p>
    <button id="reveal" type="button" hidden>Unwrap my Valentine</button>
    <div id="result" role="status" aria-atomic="true"></div>
    <button id="hide-reveal" type="button" hidden>Hide my Valentine</button>
    <noscript>Enable JavaScript in your browser to open your invitation.</noscript>
  </main>
</body>
</html>
